# Build and collect every supported desktop installer on GitHub-hosted runners.
#
# Candidate: Actions -> "Build Desktop" -> Run workflow. This uploads
# short-lived workflow artifacts and never creates a GitHub Release.
# Release: push a version tag matching app.manifest.json, such as v1.2.3.
#
# Outputs as candidate artifacts or in one draft GitHub Release:
#   - Windows x64 -> NSIS installer
#   - macOS Apple Silicon + Intel -> DMG installers
#   - Linux x64 -> AppImage
#
# Windows bundles are unsigned. macOS bundles use an ad-hoc signature but are
# not notarized. The CI override also disables Tauri updater artifacts until
# release signing is configured.

name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: npm + Rust checks
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Verify release tag matches app manifest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release-version

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Install Linux dependencies for Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust test cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: desktop-check

      - name: Run desktop host tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: ${{ matrix.label }}
    needs: check
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS)
            platform: windows-latest
            rust_target: ''
            cache_key: windows-x64
            args: --config src-tauri/tauri.ci.json --bundles nsis
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - label: macOS Apple Silicon (DMG)
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            cache_key: macos-apple-silicon
            args: --target aarch64-apple-darwin --config src-tauri/tauri.ci.json --bundles dmg
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel (DMG)
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            cache_key: macos-intel
            args: --target x86_64-apple-darwin --config src-tauri/tauri.ci.json --bundles dmg
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Linux x64 (AppImage)
            platform: ubuntu-22.04
            rust_target: ''
            cache_key: linux-x64
            args: --config src-tauri/tauri.ci.json --bundles appimage
            artifact_path: src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.cache_key }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build candidate ${{ matrix.label }}
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Upload candidate ${{ matrix.label }}
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mdular-${{ matrix.cache_key }}-candidate-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Build and upload release ${{ matrix.label }}
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            Desktop builds for this version.

            - **Windows**: x64 NSIS installer (`.exe`). Unsigned; Windows SmartScreen may warn.
            - **macOS**: DMG for Apple Silicon and Intel. Ad-hoc signed but not notarized; first open may require approval in Privacy & Security.
            - **Linux**: x64 AppImage. Run `chmod +x` before launching.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
