# Build desktop installers via GitHub-hosted runners (no local Mac/Linux required).
#
# Trigger: Actions → "Build Desktop" → Run workflow
# Or: push a tag like v0.0.4
#
# Jobs:
#   - macOS: Apple Silicon + Intel → .dmg
#   - Linux: x64 → .AppImage
#
# Unsigned by default.
# - Do NOT set empty APPLE_* secrets (breaks macOS codesign import).
# - src-tauri/tauri.ci.json disables updater signing artifacts.
#
# Later (optional):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   TAURI_SIGNING_PRIVATE_KEY (+ drop --config tauri.ci.json for updater .sig)

name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: apple-silicon
          - target: x86_64-apple-darwin
            arch: intel

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: macos-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (macOS ${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: MD Toolkit v__VERSION__
          releaseBody: |
            Desktop builds for this version.

            - **Windows**: build locally (`build-tauri-installer.bat`) → NSIS `MD.Toolkit_*_x64-setup.exe`
            - **macOS**: `.dmg` (Apple Silicon / Intel). Unsigned CI — first open may need right-click → Open.
            - **Linux**: `.AppImage` (x64). `chmod +x` then run.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.ci.json

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies (WebKitGTK / AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: linux-x86_64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Linux AppImage)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: MD Toolkit v__VERSION__
          releaseBody: |
            Desktop builds for this version.

            - **Windows**: build locally (`build-tauri-installer.bat`) → NSIS `MD.Toolkit_*_x64-setup.exe`
            - **macOS**: `.dmg` (Apple Silicon / Intel). Unsigned CI — first open may need right-click → Open.
            - **Linux**: `.AppImage` (x64). `chmod +x` then run.
          releaseDraft: true
          prerelease: false
          # Limit to AppImage on Linux (deb/rpm optional later)
          args: --config src-tauri/tauri.ci.json --bundles appimage
