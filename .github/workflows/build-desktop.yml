# Build and collect every supported desktop installer on GitHub-hosted runners.
#
# Trigger: Actions -> "Build Desktop" -> Run workflow
# Or: push a version tag such as v0.0.4.
#
# Outputs in one draft GitHub Release:
#   - Windows x64 -> NSIS installer
#   - macOS Apple Silicon + Intel -> DMG installers
#   - Linux x64 -> AppImage
#
# Windows and macOS bundles are unsigned by default. The CI override also
# disables Tauri updater artifacts until release signing is configured.

name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: npm check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

  build:
    name: ${{ matrix.label }}
    needs: check
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS)
            platform: windows-latest
            rust_target: ''
            cache_key: windows-x64
            args: --config src-tauri/tauri.ci.json --bundles nsis
          - label: macOS Apple Silicon (DMG)
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            cache_key: macos-apple-silicon
            args: --target aarch64-apple-darwin --config src-tauri/tauri.ci.json --bundles dmg
          - label: macOS Intel (DMG)
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            cache_key: macos-intel
            args: --target x86_64-apple-darwin --config src-tauri/tauri.ci.json --bundles dmg
          - label: Linux x64 (AppImage)
            platform: ubuntu-22.04
            rust_target: ''
            cache_key: linux-x64
            args: --config src-tauri/tauri.ci.json --bundles appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.cache_key }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload ${{ matrix.label }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            Desktop builds for this version.

            - **Windows**: x64 NSIS installer (`.exe`). Unsigned; Windows SmartScreen may warn.
            - **macOS**: DMG for Apple Silicon and Intel. Unsigned; first open may require right-click -> Open.
            - **Linux**: x64 AppImage. Run `chmod +x` before launching.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
