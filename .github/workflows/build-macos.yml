# Build macOS DMG via GitHub-hosted macOS runners (no local Mac required).
#
# Trigger: Actions → "Build macOS" → Run workflow
# Or: push a tag like v0.0.4
#
# Unsigned by default (no Apple Developer cert). Do NOT set empty APPLE_*
# secrets — empty values make `security import` fail during bundling.
#
# When you have a real Developer ID cert later, add these Secrets and restore
# the APPLE_* env block on the build step:
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#
# tauri.ci.json disables updater signing artifacts (no TAURI_SIGNING_PRIVATE_KEY needed).

name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: apple-silicon
          - target: x86_64-apple-darwin
            arch: intel

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: macos-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (macOS ${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: MD Toolkit v__VERSION__
          releaseBody: |
            Desktop builds for this version.
            macOS: open the `.dmg` for your chip (Apple Silicon / Intel).
            Unsigned CI build — first open may need right-click → Open.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.ci.json
